[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ld2450-desktop-toolkit"
version = "1.0.0"
description = "LD2450 mmWave Radar Desktop Visualization, Tracking & Characterization Suite"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "LD2450 Developer" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "pyserial>=3.5",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "psutil>=5.9.0"
]

[project.scripts]
ld2450-toolkit = "app.main:main"
ld2450-data-studio = "app.dataset_visualization:main"

[project.optional-dependencies]
comparison = ["torch>=2.0.0", "scikit-learn>=1.6,<1.10", "xgboost>=3.4,<3.5", "aeon==1.6.0", "numba>=0.63,<0.64", "joblib>=1.3"]

[tool.pyright]
extraPaths = [
    "C:/Users/PC/AppData/Local/Python/pythoncore-3.14-64/Lib/site-packages"
]


