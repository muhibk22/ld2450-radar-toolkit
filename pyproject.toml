[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ld2450-desktop-toolkit"
version = "1.0.0"
description = "LD2450 mmWave Radar Desktop Visualization, Tracking & Characterization Suite"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "LD2450 Developer" }
]
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "pyserial>=3.5",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "psutil>=5.9.0"
]

[project.scripts]
ld2450-toolkit = "app.main:main"
